
regulations:

  - regulation_id: RBI-KYC-2016
    title: Master Direction - Know Your Customer (KYC) Direction, 2016
    jurisdiction: India
    regulator: Reserve Bank of India
    source: Reserve Bank of India
    source_document: rbi_master_direction_kyc_2016.pdf
    source_url: https://www.rbi.org.in/commonman/Upload/English/Notification/PDFs/MD18KYCF6E92C82E1E1419D87323E3869BC9F13.pdf
    source_updated_as_of: "2024-11-06"

    requirements:

      - requirement_id: RBI-KYC-2016-R1
        topic: Transaction monitoring
        text: >
          Regulated entities should carry out ongoing due diligence on
          business relationships and scrutinise transactions to ensure
          that they are consistent with the institution's knowledge of the
          customer, the customer's business and risk profile, and the
          source of funds or wealth as appropriate.
        applicability:
          - transaction_monitoring
          - structuring
          - repeated_transactions
          - unusual_transaction
          - unusual_pattern
          - complex_transaction
          - large_transaction

      - requirement_id: RBI-KYC-2016-R2
        topic: Unusual transactions
        text: >
          Regulated entities should pay special attention to all complex,
          unusually large transactions and unusual patterns of transactions
          that have no apparent economic or lawful purpose.
        applicability:
          - transaction_monitoring
          - unusual_transaction
          - unusual_pattern
          - complex_transaction
          - large_transaction

      - requirement_id: RBI-KYC-2016-R3
        topic: Risk based monitoring
        text: >
          The extent of monitoring should be aligned with the customer's
          risk categorisation and the institution should apply enhanced
          scrutiny where the customer's risk profile warrants it.
        applicability:
          - transaction_monitoring
          - risk_based_monitoring
          - customer_risk

      - requirement_id: RBI-KYC-2016-R4
        topic: Customer information and source of funds
        text: >
          Ongoing due diligence should consider whether transactions are
          consistent with the institution's knowledge of the customer,
          including the customer's business and risk profile and, where
          necessary, the source of funds or wealth.
        applicability:
          - ongoing_due_diligence
          - source_of_funds
          - customer_profile
          - transaction_monitoring

      - requirement_id: RBI-KYC-2016-R5
        topic: Suspicious transaction monitoring
        text: >
          Regulated entities should have appropriate systems and controls
          for identifying transactions and activity that may require
          investigation and reporting under applicable anti-money-laundering
          requirements.
        applicability:
          - suspicious_transaction_pattern
          - transaction_monitoring
          - alert_investigation

      - requirement_id: RBI-KYC-2016-R6
        topic: Investigation evidence
        text: >
          Transaction monitoring and investigation should be supported by
          relevant customer and transaction information available to the
          regulated entity.
        applicability:
          - investigation
          - evidence
          - customer_information
          - transaction_information

      - requirement_id: RBI-KYC-2016-R7
        topic: Beneficial ownership and customer identification
        text: >
          Customer due diligence includes obtaining and maintaining
          appropriate information needed to identify customers and,
          where applicable, beneficial owners.
        applicability:
          - customer_due_diligence
          - customer_identification
          - beneficial_owner
